<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employer Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Job Portal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="employer_dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="post_job.html"><i class="fas fa-plus"></i> Post Job</a></li>
          <li class="nav-item"><a class="nav-link" href="candidate_search.html"><i class="fas fa-users"></i> Search Candidates</a></li>
          <li class="nav-item"><a class="nav-link" href="messages_employer.html"><i class="fas fa-envelope"></i> Messages</a></li>
        </ul>
        <button class="btn btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h3 class="text-center">Employer Dashboard</h3>
    <p class="text-center text-muted">Post jobs, review applications, and message candidates.</p>
  </div>

  <div class="container mt-4">
    <h4>Manage Jobs</h4>
    <a href="post_job.html" class="btn btn-primary mb-3">Post a New Job</a>
    <div id="myJobs" class="row"></div>
  </div>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center">
      <h4>Your Jobs</h4>
      <button class="btn btn-outline-secondary btn-sm" onclick="loadMyJobs()">Refresh</button>
    </div>
    <div id="myJobs" class="row g-3 mt-1"></div>
  </div>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center">
      <h4>Applications (for your jobs)</h4>
      <button class="btn btn-outline-secondary btn-sm" onclick="loadApplications()">Refresh</button>
    </div>
    <div id="applications" class="mt-3"></div>
  </div>

  <div class="container mt-5">
    <h4>Send Message</h4>
    <form id="messageForm" class="card p-4 shadow-sm mb-4">
      <div class="mb-3">
        <label class="form-label">Candidate User ID</label>
        <input type="text" class="form-control" name="receiverId" placeholder="Paste candidate user ID" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Job ID (optional)</label>
        <input type="text" class="form-control" name="jobId" placeholder="Related job ID">
      </div>
      <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea class="form-control" name="messageText" rows="4" placeholder="Write your message..." required></textarea>
      </div>
      <button type="submit" class="btn btn-success w-100">Send Message</button>
    </form>
  </div>

  <div class="container mt-2 mb-5">
    <div class="d-flex justify-content-between align-items-center">
      <h4>Messages</h4>
      <button class="btn btn-outline-secondary btn-sm" onclick="loadMessages()">Refresh</button>
    </div>
    <div id="messages" class="mt-3"></div>
  </div>

  <script src="Scripts/employer_dashboard.js"></script>
</body>
</html>
