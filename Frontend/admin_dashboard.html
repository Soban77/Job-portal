<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Job Portal Admin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="admin_dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="analytics.html"><i class="fas fa-chart-bar"></i> Analytics</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fas fa-user"></i> Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="messages_admin.html"><i class="fas fa-envelope"></i> Messages</a></li>
        </ul>
        <button class="btn btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h3 class="text-center">Admin Dashboard</h3>
    <p class="text-center text-muted">View users and employer profiles.</p>
  </div>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
      <h4>Users</h4>
      <button class="btn btn-outline-secondary btn-sm" onclick="loadUsers()">Refresh</button>
    </div>
    <div id="users" class="mt-3"></div>
  </div>

  <div class="container mt-5 mb-5">
    <div class="d-flex justify-content-between align-items-center">
      <h4>Employer Profiles</h4>
      <button class="btn btn-outline-secondary btn-sm" onclick="loadEmployers()">Refresh</button>
    </div>
    <div id="employers" class="mt-3"></div>
  </div>

  <script src="Scripts/admin_dashboard.js"></script>
</body>
</html>
