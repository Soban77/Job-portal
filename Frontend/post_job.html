<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Job - Job Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Job Portal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="employer_dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="post_job.html">Post Job</a></li>
          <li class="nav-item"><a class="nav-link" href="messages.html">Messages</a></li>
          <li class="nav-item"><button class="btn btn-outline-light ms-2" onclick="logout()">Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card p-4 shadow">
      <h2>Post a New Job</h2>
      <form id="jobForm">
        <div class="mb-3">
          <label for="title" class="form-label">Job Title</label>
          <input type="text" class="form-control" id="title" required>
        </div>
        <div class="mb-3">
          <label for="category" class="form-label">Category</label>
          <input type="text" class="form-control" id="category" required>
        </div>
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" rows="4" required></textarea>
        </div>
        <div class="mb-3">
          <label for="skills" class="form-label">Skills Required (comma-separated)</label>
          <input type="text" class="form-control" id="skills" placeholder="e.g., JavaScript, Node.js, MongoDB">
        </div>
        <button type="submit" class="btn btn-primary">Post Job</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Scripts/employer_dashboard.js"></script>
  <script>
    const token = localStorage.getItem('token');

    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`
      };
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '../index.html';
    }

    document.getElementById('jobForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      const skills = document.getElementById('skills').value.split(',').map(s => s.trim()).filter(s => s);

      const res = await fetch('http://localhost:5000/job', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ title, category, description, skillsRequired: skills })
      });
      const data = await res.json();
      if (res.ok) {
        alert('Job posted successfully!');
        window.location.href = 'employer_dashboard.html';
      } else {
        alert(data.error || 'Failed to post job');
      }
    });
  </script>
</body>
</html>
