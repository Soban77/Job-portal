<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Seeker Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Mobile responsive -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="../style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Job Portal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="seeker_dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="search_jobs.html"><i class="fas fa-search"></i> Search Jobs</a></li>
          <li class="nav-item"><a class="nav-link" href="resume_builder.html"><i class="fas fa-file-alt"></i> Resume Builder</a></li>
          <li class="nav-item"><a class="nav-link" href="../profile.html"><i class="fas fa-user"></i> Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="../messages.html"><i class="fas fa-envelope"></i> Messages</a></li>
        </ul>
        <button class="btn btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  
  <div class="container mt-4">
    <h3 class="text-center">Welcome, Job Seeker!</h3>
    <p class="text-center text-muted">Browse jobs and apply directly.</p>
  </div>

  <div class="container mt-4">
    <div class="card p-4 shadow-sm mb-4">
      <h5>Search jobs</h5>
      <form id="searchForm" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Keyword</label>
          <input class="form-control" name="search" placeholder="Title, description or category">
        </div>
        <div class="col-md-4">
          <label class="form-label">Category</label>
          <input class="form-control" name="category" placeholder="IT, Admin, Sales">
        </div>
        <div class="col-md-4">
          <label class="form-label">Skills</label>
          <input class="form-control" name="skills" placeholder="JavaScript, Node, React">
        </div>
        <div class="col-12 text-end">
          <button class="btn btn-outline-primary" type="submit">Filter jobs</button>
          <button class="btn btn-outline-secondary" type="button" onclick="resetFilters()">Clear</button>
        </div>
      </form>
    </div>
  </div>

  <div class="container mt-4">
    <h4>Available Jobs</h4>
    <div id="jobList" class="row g-3">
      
    </div>
  </div>

  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center">
      <h4>Your Applications</h4>
      <button class="btn btn-outline-secondary btn-sm" onclick="loadApplications()">Refresh</button>
    </div>
    <div id="applications" class="mt-3"></div>
  </div>

  <div class="container mt-5">
    <div class="row gy-4">
      <div class="col-lg-6">
        <h4>Your Profile</h4>
        <form id="profileForm" class="card p-4 shadow-sm">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" placeholder="Full name">
          </div>
          <div class="mb-3">
            <label class="form-label">Skills</label>
            <input type="text" class="form-control" name="skills" placeholder="e.g. JavaScript, SQL">
          </div>
          <div class="mb-3">
            <label class="form-label">Resume URL</label>
            <input type="url" class="form-control" name="resumeURL" placeholder="Link to your resume">
          </div>
          <div class="mb-3">
            <label class="form-label">Profile Info</label>
            <textarea class="form-control" name="profileInfo" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100">Update Profile</button>
        </form>
      </div>
      <div class="col-lg-6">
        <h4>Message an Employer</h4>
        <form id="messageForm" class="card p-4 shadow-sm">
          <div class="mb-3">
            <label class="form-label">Employer User ID</label>
            <input type="text" class="form-control" name="receiverId" placeholder="Paste employer user ID" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Job ID (optional)</label>
            <input type="text" class="form-control" name="jobId" placeholder="Related job ID">
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" name="messageText" rows="4" placeholder="Write your message..." required></textarea>
          </div>
          <button type="submit" class="btn btn-success w-100">Send Message</button>
        </form>
      </div>
    </div>

    <div class="mt-4">
      <h4>Messages</h4>
      <div id="messages" class="mt-3"></div>
    </div>
  </div>

  <script src="scripts/seeker_dashboard.js"></script>
</body>
</html>
