<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Builder - Job Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="gradient-bg">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary glass-effect">
    <div class="container">
      <a class="navbar-brand" href="../index.html"><i class="fas fa-briefcase"></i> Job Portal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="seeker_dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="search_jobs.html"><i class="fas fa-search"></i> Search Jobs</a></li>
          <li class="nav-item"><a class="nav-link active" href="resume_builder.html"><i class="fas fa-file-alt"></i> Resume Builder</a></li>
          <li class="nav-item"><a class="nav-link" href="../profile.html"><i class="fas fa-user"></i> Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="../messages.html"><i class="fas fa-envelope"></i> Messages</a></li>
        </ul>
        <button class="btn btn-outline-light" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4 fade-in">
    <div class="hero-banner text-center mb-4">
      <h1 class="text-shadow"><i class="fas fa-magic"></i> Build Your Professional Resume</h1>
      <p class="lead">Create an impressive resume that stands out to employers.</p>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="card p-4 glass-effect">
          <h3><i class="fas fa-edit"></i> Resume Details</h3>
          <form id="resumeForm">
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
              <input type="text" class="form-control" id="fullName" required>
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-phone"></i> Phone</label>
              <input type="tel" class="form-control" id="phone">
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-map-marker-alt"></i> Location</label>
              <input type="text" class="form-control" id="location">
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-graduation-cap"></i> Education</label>
              <textarea class="form-control" id="education" rows="3" placeholder="e.g., Bachelor's in Computer Science, University Name"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-briefcase"></i> Experience</label>
              <textarea class="form-control" id="experience" rows="4" placeholder="List your work experience..."></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-tools"></i> Skills</label>
              <input type="text" class="form-control" id="skills" placeholder="Comma-separated skills">
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-star"></i> Summary</label>
              <textarea class="form-control" id="summary" rows="3" placeholder="Brief professional summary..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Resume</button>
            <button type="button" class="btn btn-success ms-2" onclick="downloadResume()"><i class="fas fa-download"></i> Download PDF</button>
          </form>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-4 glass-effect">
          <h3><i class="fas fa-eye"></i> Resume Preview</h3>
          <div id="resumePreview" class="border p-3 bg-white" style="min-height: 600px;">
            <div class="text-center mb-4">
              <h2 id="previewName"></h2>
              <p id="previewContact"></p>
            </div>
            <div class="mb-3">
              <h4><i class="fas fa-star"></i> Summary</h4>
              <p id="previewSummary"></p>
            </div>
            <div class="mb-3">
              <h4><i class="fas fa-briefcase"></i> Experience</h4>
              <p id="previewExperience"></p>
            </div>
            <div class="mb-3">
              <h4><i class="fas fa-graduation-cap"></i> Education</h4>
              <p id="previewEducation"></p>
            </div>
            <div class="mb-3">
              <h4><i class="fas fa-tools"></i> Skills</h4>
              <p id="previewSkills"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/seeker_dashboard.js"></script>
  <script>
    const token = localStorage.getItem('token');

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '../index.html';
    }

    // Load existing profile data
    async function loadProfile() {
      const res = await fetch('http://localhost:5000/user/me', {
        headers: authHeaders()
      });
      const user = await res.json();
      if (res.ok) {
        document.getElementById('fullName').value = user.name || '';
        document.getElementById('email').value = user.email || '';
        // Assume additional fields are added to user model or use profileInfo
        updatePreview();
      }
    }

    function updatePreview() {
      const name = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const location = document.getElementById('location').value;
      const summary = document.getElementById('summary').value;
      const experience = document.getElementById('experience').value;
      const education = document.getElementById('education').value;
      const skills = document.getElementById('skills').value;

      document.getElementById('previewName').textContent = name;
      document.getElementById('previewContact').innerHTML = `${email} | ${phone} | ${location}`;
      document.getElementById('previewSummary').textContent = summary;
      document.getElementById('previewExperience').innerHTML = experience.replace(/\n/g, '<br>');
      document.getElementById('previewEducation').textContent = education;
      document.getElementById('previewSkills').textContent = skills;
    }

    document.getElementById('resumeForm').addEventListener('input', updatePreview);

    document.getElementById('resumeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      // Save to profile or local storage
      alert('Resume saved! (Note: In a real app, this would save to server)');
    });

    function downloadResume() {
      // Simple PDF generation using browser print
      window.print();
    }

    loadProfile();
  </script>
</body>
</html>
