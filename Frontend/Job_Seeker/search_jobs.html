<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Jobs - Job Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="gradient-bg">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary glass-effect">
    <div class="container">
      <a class="navbar-brand" href="../index.html"><i class="fas fa-briefcase"></i> Job Portal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="seeker_dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="search_jobs.html"><i class="fas fa-search"></i> Search Jobs</a></li>
          <li class="nav-item"><a class="nav-link" href="../profile.html"><i class="fas fa-user"></i> Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="../messages.html"><i class="fas fa-envelope"></i> Messages</a></li>
        </ul>
        <button class="btn btn-outline-light" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4 fade-in">
    <div class="hero-banner text-center mb-4">
      <h1 class="text-shadow"><i class="fas fa-search-plus"></i> Find Your Dream Job</h1>
      <p class="lead">Search through thousands of job opportunities tailored to your skills.</p>
    </div>

    <div class="card p-4 mb-4 glass-effect">
      <h3><i class="fas fa-filter"></i> Search Filters</h3>
      <form id="searchForm" class="row g-3">
        <div class="col-md-3">
          <label class="form-label"><i class="fas fa-search"></i> Keywords</label>
          <input type="text" class="form-control" id="search" placeholder="Job title, company, skills...">
        </div>
        <div class="col-md-2">
          <label class="form-label"><i class="fas fa-tags"></i> Category</label>
          <input type="text" class="form-control" id="category" placeholder="e.g., IT, Marketing">
        </div>
        <div class="col-md-2">
          <label class="form-label"><i class="fas fa-map-marker-alt"></i> Location</label>
          <input type="text" class="form-control" id="location" placeholder="City, Country">
        </div>
        <div class="col-md-2">
          <label class="form-label"><i class="fas fa-dollar-sign"></i> Min Salary</label>
          <input type="number" class="form-control" id="salaryMin" placeholder="50000" min="0">
        </div>
        <div class="col-md-2">
          <label class="form-label"><i class="fas fa-dollar-sign"></i> Max Salary</label>
          <input type="number" class="form-control" id="salaryMax" placeholder="200000" min="0">
        </div>
        <div class="col-md-1 d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100"><i class="fas fa-search"></i> Search</button>
        </div>
      </form>

      <!-- Advanced Filters (Collapsible) -->
      <div class="mt-3">
        <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#advancedFilters">
          <i class="fas fa-sliders-h"></i> Advanced Filters
        </button>
        <div class="collapse mt-3" id="advancedFilters">
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label"><i class="fas fa-tools"></i> Skills</label>
              <input type="text" class="form-control" id="skills" placeholder="e.g., JavaScript, Python">
            </div>
            <div class="col-md-3">
              <label class="form-label"><i class="fas fa-briefcase"></i> Job Type</label>
              <select class="form-control" id="jobType">
                <option value="">All Types</option>
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
                <option value="Contract">Contract</option>
                <option value="Freelance">Freelance</option>
                <option value="Internship">Internship</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label"><i class="fas fa-user-graduate"></i> Experience Level</label>
              <select class="form-control" id="experienceLevel">
                <option value="">All Levels</option>
                <option value="Entry">Entry Level</option>
                <option value="Mid">Mid Level</option>
                <option value="Senior">Senior Level</option>
                <option value="Executive">Executive</option>
              </select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button type="button" class="btn btn-secondary w-100" onclick="clearFilters()">
                <i class="fas fa-times"></i> Clear Filters
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="jobResults" class="row">
      <!-- Jobs will be loaded here -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/seeker_dashboard.js"></script>
  <script>
    const token = localStorage.getItem('token');

    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`
      };
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '../index.html';
    }

    document.getElementById('searchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const search = document.getElementById('search').value;
      const category = document.getElementById('category').value;
      const location = document.getElementById('location').value;
      const salaryMin = document.getElementById('salaryMin').value;
      const salaryMax = document.getElementById('salaryMax').value;
      const skills = document.getElementById('skills').value;
      const jobType = document.getElementById('jobType').value;
      const experienceLevel = document.getElementById('experienceLevel').value;

      const params = {};
      if (search) params.search = search;
      if (category) params.category = category;
      if (location) params.location = location;
      if (salaryMin) params.salaryMin = salaryMin;
      if (salaryMax) params.salaryMax = salaryMax;
      if (skills) params.skills = skills;
      if (jobType) params.jobType = jobType;
      if (experienceLevel) params.experienceLevel = experienceLevel;

      await loadJobs(params);
    });

    function clearFilters() {
      document.getElementById('search').value = '';
      document.getElementById('category').value = '';
      document.getElementById('location').value = '';
      document.getElementById('salaryMin').value = '';
      document.getElementById('salaryMax').value = '';
      document.getElementById('skills').value = '';
      document.getElementById('jobType').value = '';
      document.getElementById('experienceLevel').value = '';
      loadJobs();
    }

    async function viewJob(jobId) {
      window.location.href = `job_details.html?jobId=${jobId}`;
    }

    async function applyJob(jobId) {
      const res = await fetch('http://localhost:5000/application', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ jobId })
      });
      const data = await res.json();
      if (res.ok) {
        alert('Application submitted successfully!');
        // Optionally refresh the job list or update the UI
      } else {
        alert(data.error || 'Unable to apply for this job');
      }
    }

    async function loadJobs(params = {}) {
      const query = new URLSearchParams(params).toString();
      const url = `http://localhost:5000/job${query ? `?${query}` : ''}`;
      const res = await fetch(url);
      const jobs = await res.json();

      const jobResults = document.getElementById('jobResults');
      jobResults.innerHTML = (Array.isArray(jobs) ? jobs : []).map(job => `
        <div class="col-md-6 mb-4">
          <div class="card p-3 shadow-sm job-card fade-in">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div>
                <h5 class="mb-1"><i class="fas fa-briefcase"></i> ${job.title}</h5>
                <div class="small text-muted"><i class="fas fa-building"></i> ${job.category || 'General'}</div>
              </div>
              <span class="small-tag ${job.status === 'open' ? 'success' : 'warning'}"><i class="fas fa-circle"></i> ${job.status}</span>
            </div>
            <p class="mb-2"><i class="fas fa-info-circle"></i> ${job.description || ''}</p>
            <div class="mb-2">
              <div class="row">
                ${job.location ? `<div class="col-6"><i class="fas fa-map-marker-alt"></i> ${job.location}</div>` : ''}
                ${job.jobType ? `<div class="col-6"><i class="fas fa-briefcase"></i> ${job.jobType}</div>` : ''}
              </div>
              <div class="row">
                ${job.salaryMin || job.salaryMax ? `<div class="col-6"><i class="fas fa-dollar-sign"></i> ${job.salaryMin || 0} - ${job.salaryMax || '∞'}</div>` : ''}
                ${job.experienceLevel ? `<div class="col-6"><i class="fas fa-user-graduate"></i> ${job.experienceLevel}</div>` : ''}
              </div>
            </div>
            <div class="mb-3">
              <strong><i class="fas fa-tools"></i> Skills:</strong>
              ${(Array.isArray(job.skillsRequired) ? job.skillsRequired : []).map(skill => `<span class="small-tag soft"><i class="fas fa-tag"></i> ${skill}</span>`).join(' ')}
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary flex-fill" onclick="viewJob('${job._id}')"><i class="fas fa-eye"></i> View Details</button>
              <button class="btn btn-success flex-fill" onclick="applyJob('${job._id}')"><i class="fas fa-paper-plane"></i> Apply</button>
            </div>
          </div>
        </div>
      `).join('') || `<div class="col-12"><div class="alert alert-info text-center"><i class="fas fa-search"></i> No jobs match your search criteria.</div></div>`;
    }

    // Load all jobs on page load
    loadJobs();
  </script>
</body>
</html>
