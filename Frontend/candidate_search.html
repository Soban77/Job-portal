<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Candidates - Job Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="gradient-bg">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary glass-effect">
    <div class="container">
      <a class="navbar-brand" href="../index.html"><i class="fas fa-briefcase"></i> Job Portal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="employer_dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="post_job.html"><i class="fas fa-plus"></i> Post Job</a></li>
          <li class="nav-item"><a class="nav-link active" href="candidate_search.html"><i class="fas fa-users"></i> Search Candidates</a></li>
          <li class="nav-item"><a class="nav-link" href="../messages.html"><i class="fas fa-envelope"></i> Messages</a></li>
        </ul>
        <button class="btn btn-outline-light" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4 fade-in">
    <div class="hero-banner text-center mb-4">
      <h1 class="text-shadow"><i class="fas fa-users-cog"></i> Find the Perfect Candidates</h1>
      <p class="lead">Search through qualified job seekers for your open positions.</p>
    </div>

    <div class="card p-4 mb-4 glass-effect">
      <h3><i class="fas fa-filter"></i> Search Filters</h3>
      <form id="searchForm" class="row g-3">
        <div class="col-md-4">
          <label class="form-label"><i class="fas fa-search"></i> Keywords</label>
          <input type="text" class="form-control" id="search" placeholder="Name, skills, profile...">
        </div>
        <div class="col-md-4">
          <label class="form-label"><i class="fas fa-tools"></i> Skills</label>
          <input type="text" class="form-control" id="skills" placeholder="e.g., JavaScript, Python">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100"><i class="fas fa-search"></i> Search</button>
        </div>
      </form>
    </div>

    <div id="candidateResults" class="row">
      <!-- Candidates will be loaded here -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Scripts/employer_dashboard.js"></script>
  <script>
    const token = localStorage.getItem('token');

    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`
      };
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '../index.html';
    }

    document.getElementById('searchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const search = document.getElementById('search').value;
      const skills = document.getElementById('skills').value;

      await loadCandidates({ search, skills });
    });

    async function loadCandidates(params = {}) {
      // For demo, fetch all users with seeker role (in real app, need a dedicated endpoint)
      const res = await fetch('http://localhost:5000/user?role=seeker', {
        headers: authHeaders()
      });
      const candidates = await res.json();

      let filtered = candidates;
      if (params.search) {
        const term = params.search.toLowerCase();
        filtered = filtered.filter(c => 
          c.name.toLowerCase().includes(term) || 
          (c.profileInfo && c.profileInfo.toLowerCase().includes(term))
        );
      }
      if (params.skills) {
        const skillList = params.skills.split(',').map(s => s.trim().toLowerCase());
        filtered = filtered.filter(c => 
          c.skills && c.skills.some(skill => skillList.includes(skill.toLowerCase()))
        );
      }

      const candidateResults = document.getElementById('candidateResults');
      candidateResults.innerHTML = filtered.map(c => `
        <div class="col-md-6 mb-4">
          <div class="card p-3 shadow-sm job-card fade-in">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div>
                <h5 class="mb-1"><i class="fas fa-user"></i> ${c.name}</h5>
                <div class="small text-muted"><i class="fas fa-envelope"></i> ${c.email}</div>
              </div>
            </div>
            <p class="mb-2"><i class="fas fa-info-circle"></i> ${c.profileInfo || 'No summary available'}</p>
            <div class="mb-3">
              <strong><i class="fas fa-tools"></i> Skills:</strong>
              ${(c.skills || []).map(skill => `<span class="small-tag soft"><i class="fas fa-tag"></i> ${skill}</span>`).join(' ')}
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary flex-fill" onclick="viewProfile('${c._id}')"><i class="fas fa-eye"></i> View Profile</button>
              <button class="btn btn-success flex-fill" onclick="sendMessage('${c.email}')"><i class="fas fa-envelope"></i> Message</button>
            </div>
          </div>
        </div>
      `).join('') || `<div class="col-12"><div class="alert alert-info text-center"><i class="fas fa-users"></i> No candidates match your search.</div></div>`;
    }

    function viewProfile(id) {
      // In real app, link to profile page
      alert('Profile view not implemented yet');
    }

    function sendMessage(email) {
      window.location.href = `../messages.html?to=${email}`;
    }

    // Load all candidates on page load
    loadCandidates();
  </script>
</body>
</html>
