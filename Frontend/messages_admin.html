<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Admin - Job Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Admin Navbar (Secondary Gray) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Job Portal Admin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="admin_dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="analytics.html"><i class="fas fa-chart-bar"></i> Analytics</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fas fa-user"></i> Profile</a></li>
          <li class="nav-item"><a class="nav-link active" href="messages_admin.html"><i class="fas fa-envelope"></i> Messages</a></li>
        </ul>
        <button class="btn btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="text-center mb-4">Messages</h2>
    <p class="text-center text-muted">View system messages and administrator communications.</p>
  </div>

  <div class="container mt-4">
    <div class="row">
      <!-- Messages List -->
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">
              <i class="fas fa-inbox"></i> All Messages
              <button class="btn btn-sm btn-outline-light float-end" onclick="loadMessages()"><i class="fas fa-sync"></i> Refresh</button>
            </h5>
          </div>
          <div class="card-body" style="max-height: 700px; overflow-y: auto;">
            <div id="messageList"></div>
          </div>
        </div>
      </div>

      <!-- Admin Info -->
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header bg-secondary text-white">
            <h5 class="mb-0"><i class="fas fa-shield-alt"></i> Admin Panel</h5>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label"><strong>System Status</strong></label>
              <div class="alert alert-success mb-0"><i class="fas fa-check-circle"></i> Operational</div>
            </div>
            <div class="mb-3">
              <label class="form-label"><strong>Message Statistics</strong></label>
              <div id="stats" class="text-muted">Loading...</div>
            </div>
            <div class="mb-3">
              <label class="form-label"><strong>Actions</strong></label>
              <button class="btn btn-sm btn-secondary w-100" onclick="clearOldMessages()">
                <i class="fas fa-trash"></i> Archive Old Messages (30+ days)
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const token = localStorage.getItem('token');

    if (!token) {
      window.location.href = 'index.html';
    }

    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`
      };
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'index.html';
    }

    async function loadMessages() {
      try {
        const res = await fetch('http://localhost:5000/message', {
          headers: authHeaders()
        });

        if (!res.ok) {
          throw new Error('Failed to load messages');
        }

        const messages = await res.json();
        const messageList = document.getElementById('messageList');

        if (!Array.isArray(messages) || messages.length === 0) {
          messageList.innerHTML = '<div class="alert alert-info"><i class="fas fa-info-circle"></i> No messages in system.</div>';
          updateStats(0);
          return;
        }

        updateStats(messages.length);

        messageList.innerHTML = messages.map((msg, idx) => {
          const senderName = msg.senderId?.name || msg.senderId || 'Unknown';
          const receiverName = msg.receiverId?.name || msg.receiverId || 'Unknown';
          const timestamp = new Date(msg.timestamp).toLocaleString();
          return `
            <div class="card mb-3 border-start border-secondary border-4">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <div>
                    <h6 class="mb-1"><strong>Message #${idx + 1}</strong></h6>
                    <small class="text-muted">${timestamp}</small>
                  </div>
                  ${msg.jobId ? `<span class="badge bg-secondary">Job: ${msg.jobId}</span>` : ''}
                </div>
                <div class="mb-2">
                  <small><strong>From:</strong> ${senderName} → <strong>To:</strong> ${receiverName}</small>
                </div>
                <p class="mb-0">${msg.messageText}</p>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        const messageList = document.getElementById('messageList');
        messageList.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> Error: ${err.message}</div>`;
      }
    }

    function updateStats(count) {
      document.getElementById('stats').innerHTML = `
        <div class="mb-2"><small><strong>Total Messages:</strong> ${count}</small></div>
        <div class="mb-2"><small><strong>System Time:</strong> ${new Date().toLocaleString()}</small></div>
        <div class="mb-0"><small><strong>Status:</strong> <span class="badge bg-success">Active</span></small></div>
      `;
    }

    async function clearOldMessages() {
      if (!confirm('Archive messages older than 30 days? This action is irreversible.')) return;
      try {
        alert('Archive feature coming soon. Contact system administrator.');
      } catch (err) {
        alert(`Error: ${err.message}`);
      }
    }

    // Load messages on page load
    loadMessages();
  </script>
</body>
</html>
