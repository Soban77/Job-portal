<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Mobile responsive -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="container mt-5">
  <div class="hero-banner mb-4">
    <h2 class="text-center mb-3">Login</h2>
    <p class="text-muted text-center">Access your employer, seeker or admin workspace with secure JWT authentication.</p>
  </div>
  <form id="loginForm" class="card p-4 shadow-sm">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" required>
    </div>
    <button type="submit" class="btn btn-success w-100">Login</button>
  </form>

  <div class="text-center mt-3">
    <a href="register.html">Create an account</a>
  </div>

  <script src="Scripts/login.js"></script>
</body>
</html>
