<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Schedule - Job Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body class="gradient-bg">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary glass-effect">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fas fa-calendar-check"></i> Job Portal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" id="dashboardLink" href="#"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="interview_schedule.html"><i class="fas fa-calendar-check"></i> Interview Schedule</a></li>
        </ul>
        <button class="btn btn-outline-light" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4 fade-in">
    <div class="hero-banner text-center mb-4">
      <h1 class="text-shadow"><i class="fas fa-calendar-check"></i> Interview Schedule Management</h1>
      <p class="lead">Schedule and manage interviews with candidates or employers.</p>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="card p-4 glass-effect">
          <h3><i class="fas fa-plus"></i> Schedule New Interview</h3>
          <form id="scheduleForm">
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-person"></i> Candidate/Employer Email</label>
              <input type="email" class="form-control" id="intervieweeEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-briefcase"></i> Job Title</label>
              <input type="text" class="form-control" id="jobTitle" required>
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-calendar"></i> Interview Date</label>
              <input type="text" class="form-control" id="interviewDate" required placeholder="Select date">
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-clock"></i> Interview Time</label>
              <input type="time" class="form-control" id="interviewTime" required>
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-info-circle"></i> Interview Notes</label>
              <textarea class="form-control" id="interviewNotes" rows="3" placeholder="Add any notes for the interview..."></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fas fa-video"></i> Interview Type</label>
              <select class="form-select" id="interviewType">
                <option value="phone">Phone Call</option>
                <option value="video">Video Call</option>
                <option value="inperson">In-Person</option>
                <option value="email">Email Round</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-check"></i> Schedule Interview</button>
          </form>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card p-4 glass-effect">
          <h3><i class="fas fa-list"></i> Upcoming Interviews</h3>
          <div id="upcomingInterviews">
            <p class="text-muted">Loading interviews...</p>
          </div>
        </div>
      </div>
    </div>

    <div class="card p-4 mt-4 glass-effect">
      <h3><i class="fas fa-history"></i> Interview History</h3>
      <div id="interviewHistory"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    const token = localStorage.getItem('token');

    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`
      };
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'index.html';
    }

    // Initialize date picker
    flatpickr('#interviewDate', {
      minDate: new Date(),
      enableTime: false,
      dateFormat: 'Y-m-d'
    });

    // Set dashboard link based on role
    async function setDashboardLink() {
      const res = await fetch('http://localhost:5000/user/me', {
        headers: authHeaders()
      });
      const user = await res.json();
      if (res.ok) {
        if (user.role === 'seeker') {
          document.getElementById('dashboardLink').href = 'Job_Seeker/seeker_dashboard.html';
        } else if (user.role === 'employer') {
          document.getElementById('dashboardLink').href = 'employer_dashboard.html';
        } else {
          document.getElementById('dashboardLink').href = 'admin_dashboard.html';
        }
      }
    }

    // Load upcoming interviews
    async function loadUpcomingInterviews() {
      try {
        const res = await fetch('http://localhost:5000/application', {
          headers: authHeaders()
        });
        const applications = await res.json();

        // Filter applications with scheduled interviews
        const upcomingInterviews = applications.filter(app => app.interviewDate && new Date(app.interviewDate) > new Date());

        const container = document.getElementById('upcomingInterviews');
        container.innerHTML = upcomingInterviews.map(app => `
          <div class="card mb-2 p-2">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h5 class="mb-1"><i class="fas fa-briefcase"></i> ${app.jobId?.title || 'Job'}</h5>
                <small class="text-muted"><i class="fas fa-person"></i> ${app.seekerId?.name || 'Candidate'}</small>
              </div>
              <span class="badge bg-success">Scheduled</span>
            </div>
            <p class="mb-1 mt-2">
              <i class="fas fa-calendar"></i> ${new Date(app.interviewDate).toLocaleDateString()}
              <i class="fas fa-clock ms-2"></i> ${new Date(app.interviewDate).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
            </p>
            <button class="btn btn-sm btn-info" onclick="viewInterviewDetails('${app._id}')"><i class="fas fa-eye"></i> View</button>
            <button class="btn btn-sm btn-warning" onclick="rescheduleInterview('${app._id}')"><i class="fas fa-edit"></i> Reschedule</button>
          </div>
        `).join('') || '<p class="text-muted">No upcoming interviews scheduled.</p>';
      } catch (err) {
        console.error(err);
      }
    }

    // Submit schedule form
    document.getElementById('scheduleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const intervieweeEmail = document.getElementById('intervieweeEmail').value;
      const jobTitle = document.getElementById('jobTitle').value;
      const interviewDate = new Date(document.getElementById('interviewDate').value + ' ' + document.getElementById('interviewTime').value);
      const interviewNotes = document.getElementById('interviewNotes').value;
      const interviewType = document.getElementById('interviewType').value;

      // In a real app, this would be linked to actual applications
      alert(`Interview scheduled!\n\nCandidate: ${intervieweeEmail}\nJob: ${jobTitle}\nDate: ${interviewDate.toLocaleString()}\nType: ${interviewType}`);
      document.getElementById('scheduleForm').reset();
      loadUpcomingInterviews();
    });

    function viewInterviewDetails(appId) {
      alert('Interview details for application: ' + appId);
    }

    function rescheduleInterview(appId) {
      alert('Reschedule interview for application: ' + appId);
    }

    setDashboardLink();
    loadUpcomingInterviews();
  </script>
</body>
</html>
