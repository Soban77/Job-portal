<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Job Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Job Portal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" id="dashboardLink" href="#">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="messages.html">Messages</a></li>
          <li class="nav-item"><button class="btn btn-outline-light ms-2" onclick="logout()">Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row">
      <div class="col-md-8">
        <div class="card p-4 shadow">
          <h2>Messages</h2>
          <div id="messageList"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-4 shadow">
          <h3>Send Message</h3>
          <form id="messageForm">
            <div class="mb-3">
              <label for="recipient" class="form-label">Recipient Email</label>
              <input type="email" class="form-control" id="recipient" required>
            </div>
            <div class="mb-3">
              <label for="subject" class="form-label">Subject</label>
              <input type="text" class="form-control" id="subject" required>
            </div>
            <div class="mb-3">
              <label for="content" class="form-label">Message</label>
              <textarea class="form-control" id="content" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const token = localStorage.getItem('token');

    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`
      };
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '../index.html';
    }

    async function loadMessages() {
      const res = await fetch('http://localhost:5000/message', {
        headers: authHeaders()
      });
      const messages = await res.json();
      if (res.ok) {
        const messageList = document.getElementById('messageList');
        messageList.innerHTML = (Array.isArray(messages) ? messages : []).map(msg => `
          <div class="card mb-3">
            <div class="card-body">
              <h5 class="card-title">${msg.subject}</h5>
              <h6 class="card-subtitle mb-2 text-muted">From: ${msg.sender?.name || msg.senderId} | To: ${msg.receiver?.name || msg.receiverId}</h6>
              <p class="card-text">${msg.content}</p>
              <small class="text-muted">${new Date(msg.createdAt).toLocaleString()}</small>
            </div>
          </div>
        `).join('') || '<p>No messages.</p>';
      }
    }

    document.getElementById('messageForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const recipient = document.getElementById('recipient').value;
      const subject = document.getElementById('subject').value;
      const content = document.getElementById('content').value;

      const res = await fetch('http://localhost:5000/message', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ recipient, subject, content })
      });
      const data = await res.json();
      if (res.ok) {
        alert('Message sent!');
        document.getElementById('messageForm').reset();
        loadMessages();
      } else {
        alert(data.error || 'Failed to send message');
      }
    });

    // Determine dashboard link based on role
    async function setDashboardLink() {
      const res = await fetch('http://localhost:5000/user/me', {
        headers: authHeaders()
      });
      const user = await res.json();
      if (res.ok) {
        if (user.role === 'seeker') {
          document.getElementById('dashboardLink').href = 'Job_Seeker/seeker_dashboard.html';
        } else if (user.role === 'employer') {
          document.getElementById('dashboardLink').href = 'employer_dashboard.html';
        } else {
          document.getElementById('dashboardLink').href = 'admin_dashboard.html';
        }
      }
    }

    setDashboardLink();
    loadMessages();
  </script>
</body>
</html>
